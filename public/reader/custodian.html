<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading: CUSTODIAN: How To Lead, Grow And Win In The Age Of AI | Systovation Publishing</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- PDF.js for rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        :root {
            --bg: #1A1A1A;
            --bg-light: #2A2A2A;
            --text: #FAFAFA;
            --text-muted: #999;
            --accent: #2D5A4A;
            --accent-light: #3D7A6A;
            --gold: #B8860B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--bg-light);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-btn:hover { color: var(--text); }

        .book-info h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .book-info span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .page-indicator {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .page-indicator strong {
            color: var(--text);
        }

        .fullscreen-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .fullscreen-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Reader Container */
        .reader-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        .flipbook-wrapper {
            position: relative;
            max-width: 900px;
            width: 100%;
            perspective: 2000px;
        }

        .flipbook {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .page {
            width: 400px;
            height: 565px;
            background: white;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .page canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .page.turning-right {
            transform-origin: left center;
            transform: rotateY(-90deg);
        }

        .page.turning-left {
            transform-origin: right center;
            transform: rotateY(90deg);
        }

        /* Navigation */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 10;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-btn:disabled:hover {
            transform: translateY(-50%);
        }

        .nav-prev { left: 20px; }
        .nav-next { right: 20px; }

        /* Preview Limit Banner */
        .preview-limit {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .preview-limit.visible {
            transform: translateY(0);
        }

        .preview-limit p {
            font-size: 1rem;
        }

        .preview-limit strong {
            color: var(--gold);
        }

        .btn-buy {
            background: white;
            color: var(--accent);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .btn-buy:hover {
            transform: translateY(-2px);
        }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Thumbnails */
        .thumbnails {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-light);
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .reader-container:hover .thumbnails {
            opacity: 1;
        }

        .thumb {
            width: 40px;
            height: 56px;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
            opacity: 0.6;
        }

        .thumb:hover {
            transform: scale(1.1);
        }

        .thumb.active {
            opacity: 1;
            box-shadow: 0 0 0 2px var(--accent);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .flipbook-wrapper { max-width: 100%; }
            .page {
                width: 100%;
                max-width: 400px;
                height: auto;
                aspect-ratio: 0.7;
            }
            .nav-btn {
                width: 44px;
                height: 44px;
            }
            .nav-prev { left: 8px; }
            .nav-next { right: 8px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="reader-header">
        <div class="header-left">
            <a href="/book/custodian.html" class="back-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back
            </a>
            <div class="book-info">
                <h1>CUSTODIAN: How To Lead, Grow And Win In The Age Of AI</h1>
                <span>by Chris Black</span>
            </div>
        </div>
        <div class="header-right">
            <span class="page-indicator">
                Page <strong id="currentPage">1</strong> of <strong id="totalPages">10</strong>
            </span>
            <button class="fullscreen-btn" onclick="toggleFullscreen()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
                Fullscreen
            </button>
        </div>
    </header>

    <!-- Reader -->
    <main class="reader-container" id="readerContainer">
        <div class="flipbook-wrapper">
            <div class="flipbook" id="flipbook">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Loading preview...</p>
                </div>
            </div>
        </div>

        <button class="nav-btn nav-prev" id="prevBtn" onclick="prevPage()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>

        <button class="nav-btn nav-next" id="nextBtn" onclick="nextPage()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </button>

        <div class="thumbnails" id="thumbnails"></div>
    </main>

    <!-- Preview Limit Banner -->
    <div class="preview-limit" id="previewLimit">
        <p>📖 You've reached the end of the free preview. <strong>Get the full book!</strong></p>
        <a href="https://www.amazon.ca/CUSTODIAN-Lead-Grow-Win-Age/dp/1998440435" class="btn-buy" target="_blank">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            Buy Full Book
        </a>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            pdfUrl: '/assets/pdfs/custodian.pdf',
            previewPages: 10,
            bookSlug: 'custodian'
        };

        // State
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = CONFIG.previewPages;
        let pageCanvases = {};
        let isRendering = false;

        // Initialize PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Load PDF
        async function loadPDF() {
            try {
                const loadingTask = pdfjsLib.getDocument(CONFIG.pdfUrl);
                pdfDoc = await loadingTask.promise;
                
                // Limit to preview pages
                totalPages = Math.min(pdfDoc.numPages, CONFIG.previewPages);
                document.getElementById('totalPages').textContent = totalPages;
                
                // Render first page
                await renderPage(1);
                
                // Hide loading, show flipbook
                document.getElementById('loading').style.display = 'none';
                
                // Generate thumbnails
                generateThumbnails();
                
                updateNavigation();
                
            } catch (error) {
                console.error('Error loading PDF:', error);
                document.getElementById('loading').innerHTML = `
                    <p style="color: #ff6b6b;">Failed to load preview</p>
                    <p style="font-size: 0.9rem;">Please try again later</p>
                `;
            }
        }

        // Render a page
        async function renderPage(pageNum) {
            if (isRendering) return;
            isRendering = true;

            try {
                const page = await pdfDoc.getPage(pageNum);
                
                // Calculate scale
                const viewport = page.getViewport({ scale: 1 });
                const container = document.querySelector('.page') || document.getElementById('flipbook');
                const maxWidth = Math.min(400, window.innerWidth - 200);
                const scale = maxWidth / viewport.width;
                const scaledViewport = page.getViewport({ scale });

                // Create canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;

                // Render
                await page.render({
                    canvasContext: ctx,
                    viewport: scaledViewport
                }).promise;

                // Store and display
                pageCanvases[pageNum] = canvas;
                
                // Update flipbook
                const flipbook = document.getElementById('flipbook');
                flipbook.innerHTML = '';
                
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                pageDiv.appendChild(canvas);
                flipbook.appendChild(pageDiv);

            } catch (error) {
                console.error('Error rendering page:', error);
            }

            isRendering = false;
        }

        // Navigation
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
                updateNavigation();
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
                updateNavigation();
                
                // Show preview limit banner on last page
                if (currentPage === totalPages) {
                    document.getElementById('previewLimit').classList.add('visible');
                }
            }
        }

        function goToPage(pageNum) {
            if (pageNum >= 1 && pageNum <= totalPages) {
                currentPage = pageNum;
                renderPage(currentPage);
                updateNavigation();
            }
        }

        function updateNavigation() {
            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            
            // Update thumbnails
            document.querySelectorAll('.thumb').forEach((thumb, i) => {
                thumb.classList.toggle('active', i + 1 === currentPage);
            });
        }

        // Generate thumbnails
        function generateThumbnails() {
            const container = document.getElementById('thumbnails');
            container.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const thumb = document.createElement('div');
                thumb.className = 'thumb' + (i === 1 ? ' active' : '');
                thumb.onclick = () => goToPage(i);
                container.appendChild(thumb);
            }
        }

        // Fullscreen
        function toggleFullscreen() {
            const container = document.getElementById('readerContainer');
            if (!document.fullscreenElement) {
                container.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevPage();
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'f') toggleFullscreen();
        });

        // Touch/swipe support
        let touchStartX = 0;
        document.getElementById('readerContainer').addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });
        
        document.getElementById('readerContainer').addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextPage();
                else prevPage();
            }
        });

        // Initialize
        loadPDF();
    </script>
</body>
</html>
