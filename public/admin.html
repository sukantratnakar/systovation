<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Systovation Publishing</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0F172A;
            --bg-card: #1E293B;
            --text: #F1F5F9;
            --text-muted: #94A3B8;
            --accent: #2D5A4A;
            --accent-light: #3D7A6A;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        header h1 span { color: var(--accent); }

        .logout-btn {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Login */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
        }

        .login-card h2 {
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--accent-light);
        }

        /* Dashboard */
        .dashboard { display: none; }
        .dashboard.active { display: block; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 12px;
        }

        .stat-card h3 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .tab {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Tab Content */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Table */
        .table-wrapper {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(0,0,0,0.2);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        td { font-size: 0.95rem; }

        tr:hover { background: rgba(255,255,255,0.02); }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success { background: rgba(16,185,129,0.2); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,0.2); color: var(--warning); }
        .badge-danger { background: rgba(239,68,68,0.2); color: var(--danger); }

        /* Toggle */
        .toggle {
            width: 48px;
            height: 24px;
            background: var(--border);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle.active { background: var(--success); }

        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.2s;
        }

        .toggle.active::after { left: 26px; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
        }

        .modal h2 { margin-bottom: 24px; }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        /* Actions */
        .actions-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn-add {
            background: var(--accent);
            color: white;
        }

        .btn-export {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        @media (max-width: 768px) {
            .tabs { overflow-x: auto; }
            table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h2>🔐 Admin Login</h2>
            <form onsubmit="login(event)">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="container">
            <header>
                <h1>Systo<span>vation</span> Admin</h1>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </header>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="totalBooks">0</h3>
                    <p>Total Books</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalLeads">0</h3>
                    <p>Preview Requests</p>
                </div>
                <div class="stat-card">
                    <h3 id="todayLeads">0</h3>
                    <p>Today's Leads</p>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="books">📚 Books</button>
                <button class="tab" data-tab="leads">📋 Leads</button>
                <button class="tab" data-tab="settings">⚙️ Settings</button>
            </div>

            <!-- Books Tab -->
            <div class="tab-content active" id="tab-books">
                <div class="actions-row">
                    <button class="btn btn-add" onclick="openBookModal()">+ Add Book</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Cover</th>
                                <th>Title</th>
                                <th>Author</th>
                                <th>Genre</th>
                                <th>Preview</th>
                                <th>Download</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="booksTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Leads Tab -->
            <div class="tab-content" id="tab-leads">
                <div class="actions-row">
                    <span></span>
                    <button class="btn btn-export" onclick="exportLeads()">📥 Export CSV</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Book</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="leadsTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Settings Tab -->
            <div class="tab-content" id="tab-settings">
                <div class="table-wrapper" style="padding: 24px;">
                    <h3 style="margin-bottom: 20px;">Default Settings</h3>
                    <div class="form-group">
                        <label>Default Preview Pages</label>
                        <input type="number" id="defaultPreviewPages" value="10" min="1" max="50">
                    </div>
                    <div class="form-group">
                        <label>Require Form Before Preview</label>
                        <div class="toggle active" id="requireForm" onclick="this.classList.toggle('active')"></div>
                    </div>
                    <button class="btn btn-primary" style="width: auto; margin-top: 16px;" onclick="saveSettings()">Save Settings</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Book Modal -->
    <div class="modal-overlay" id="bookModal">
        <div class="modal">
            <h2 id="modalTitle">Add Book</h2>
            <form id="bookForm">
                <input type="hidden" id="bookId">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="bookTitle" required>
                </div>
                <div class="form-group">
                    <label>Author *</label>
                    <input type="text" id="bookAuthor" required>
                </div>
                <div class="form-group">
                    <label>Genre</label>
                    <select id="bookGenre">
                        <option value="Personal Development">Personal Development</option>
                        <option value="Business">Business</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Memoir">Memoir</option>
                        <option value="Self-Help">Self-Help</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="bookDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Cover Image URL</label>
                    <input type="text" id="bookCover" placeholder="/assets/covers/book.jpg">
                </div>
                <div class="form-group">
                    <label>PDF Path</label>
                    <input type="text" id="bookPdf" placeholder="/assets/pdfs/book.pdf">
                </div>
                <div class="form-group">
                    <label>Preview Pages</label>
                    <input type="number" id="bookPreviewPages" value="10" min="1" max="50">
                </div>
                <div class="form-group">
                    <label>Amazon Buy Link</label>
                    <input type="text" id="bookAmazon" placeholder="https://amazon.com/...">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeBookModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Book</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Admin password (in production, use proper auth)
        const ADMIN_PASSWORD = 'Systo@Publish2026!';
        
        // State
        let books = [];
        let leads = [];

        // Auth
        function login(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            if (password === ADMIN_PASSWORD) {
                localStorage.setItem('systovation_admin', 'true');
                showDashboard();
            } else {
                alert('Invalid password');
            }
        }

        function logout() {
            localStorage.removeItem('systovation_admin');
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboard').classList.remove('active');
        }

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            loadData();
        }

        // Data
        async function loadData() {
            // Load books
            try {
                const res = await fetch('/data/books.json');
                const data = await res.json();
                books = data.books || [];
            } catch (e) {
                books = JSON.parse(localStorage.getItem('systovation_books') || '[]');
            }
            
            // Load leads from localStorage
            leads = JSON.parse(localStorage.getItem('systovation_leads') || '[]');
            
            // Update UI
            renderBooks();
            renderLeads();
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalBooks').textContent = books.length;
            document.getElementById('totalLeads').textContent = leads.length;
            
            const today = new Date().toISOString().split('T')[0];
            const todayLeads = leads.filter(l => l.timestamp?.startsWith(today)).length;
            document.getElementById('todayLeads').textContent = todayLeads;
        }

        function renderBooks() {
            const tbody = document.getElementById('booksTable');
            tbody.innerHTML = books.map(book => `
                <tr>
                    <td><img src="${book.cover || ''}" style="width:50px;height:70px;object-fit:cover;border-radius:4px;" onerror="this.style.background='#334155'"></td>
                    <td><strong>${book.title}</strong></td>
                    <td>${book.author}</td>
                    <td><span class="badge badge-success">${book.genre || 'General'}</span></td>
                    <td>${book.previewPages || 10} pages</td>
                    <td>
                        <div class="toggle ${book.downloadEnabled ? 'active' : ''}" 
                             onclick="toggleDownload('${book.id}')"></div>
                    </td>
                    <td>
                        <button onclick="editBook('${book.id}')" style="background:none;border:none;color:var(--accent);cursor:pointer;">Edit</button>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">No books yet</td></tr>';
        }

        function renderLeads() {
            const tbody = document.getElementById('leadsTable');
            tbody.innerHTML = leads.map(lead => `
                <tr>
                    <td>${lead.name}</td>
                    <td><a href="mailto:${lead.email}">${lead.email}</a></td>
                    <td>${lead.phone || '-'}</td>
                    <td>${lead.book}</td>
                    <td>${new Date(lead.timestamp).toLocaleDateString()}</td>
                </tr>
            `).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">No leads yet</td></tr>';
        }

        // Book Modal
        function openBookModal(id = null) {
            document.getElementById('modalTitle').textContent = id ? 'Edit Book' : 'Add Book';
            document.getElementById('bookForm').reset();
            document.getElementById('bookId').value = id || '';
            
            if (id) {
                const book = books.find(b => b.id === id);
                if (book) {
                    document.getElementById('bookTitle').value = book.title;
                    document.getElementById('bookAuthor').value = book.author;
                    document.getElementById('bookGenre').value = book.genre || 'Personal Development';
                    document.getElementById('bookDescription').value = book.description || '';
                    document.getElementById('bookCover').value = book.cover || '';
                    document.getElementById('bookPdf').value = book.pdfPath || '';
                    document.getElementById('bookPreviewPages').value = book.previewPages || 10;
                    document.getElementById('bookAmazon').value = book.buyLinks?.amazon || '';
                }
            }
            
            document.getElementById('bookModal').classList.add('active');
        }

        function closeBookModal() {
            document.getElementById('bookModal').classList.remove('active');
        }

        function editBook(id) {
            openBookModal(id);
        }

        function toggleDownload(id) {
            const book = books.find(b => b.id === id);
            if (book) {
                book.downloadEnabled = !book.downloadEnabled;
                saveBooks();
                renderBooks();
            }
        }

        // Form submission
        document.getElementById('bookForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('bookId').value || 'book-' + Date.now();
            const title = document.getElementById('bookTitle').value;
            const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            
            const bookData = {
                id,
                title,
                slug,
                author: document.getElementById('bookAuthor').value,
                genre: document.getElementById('bookGenre').value,
                description: document.getElementById('bookDescription').value,
                cover: document.getElementById('bookCover').value,
                pdfPath: document.getElementById('bookPdf').value,
                previewPages: parseInt(document.getElementById('bookPreviewPages').value) || 10,
                buyLinks: {
                    amazon: document.getElementById('bookAmazon').value
                },
                downloadEnabled: false
            };
            
            const existingIndex = books.findIndex(b => b.id === id);
            if (existingIndex >= 0) {
                books[existingIndex] = { ...books[existingIndex], ...bookData };
            } else {
                books.push(bookData);
            }
            
            saveBooks();
            closeBookModal();
            renderBooks();
            updateStats();
        });

        function saveBooks() {
            localStorage.setItem('systovation_books', JSON.stringify(books));
            // In production, would POST to API
        }

        // Export leads
        function exportLeads() {
            const csv = [
                ['Name', 'Email', 'Phone', 'Book', 'Date'].join(','),
                ...leads.map(l => [
                    l.name,
                    l.email,
                    l.phone || '',
                    l.book,
                    l.timestamp
                ].join(','))
            ].join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `systovation-leads-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
            });
        });

        // Settings
        function saveSettings() {
            alert('Settings saved!');
        }

        // Init
        if (localStorage.getItem('systovation_admin') === 'true') {
            showDashboard();
        }

        // Close modal on click outside
        document.getElementById('bookModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeBookModal();
        });
    </script>
</body>
</html>
